<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牧場ダッシュ</title>
<meta name="description" content="つながって育つ、ゆるかわ牧場づくり。走って拾って、出荷して、牧場を広げていく縦画面のゲームです。">
<style>
  :root { --bg: #fff6e3; --card: #ffffff; --ink: #5b3a29; --sub: #8a6b52; --accent: #f48038; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2a211b; --card: #3a2e26; --ink: #f6e9da; --sub: #cbb39c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  .head { display: flex; align-items: center; gap: 20px; }
  .head img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h1 { margin: 0; font-size: 28px; }
  .tag { margin: 0; color: var(--sub); }
  .card { background: var(--card); border-radius: 18px; padding: 20px 24px; margin-top: 28px; }
  ul { padding-left: 1.2em; margin: 8px 0; }
  a { color: var(--accent); }
  .store { display: inline-block; margin-top: 24px; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: bold; }
  footer { margin-top: 40px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <img src="icon.png" alt="牧場ダッシュのアイコン">
    <div>
      <h1>牧場ダッシュ</h1>
      <p class="tag">つながって育つ、ゆるかわ牧場づくり</p>
    </div>
  </div>
  <a class="store" href="https://apps.apple.com/jp/app/id6828237805">App Store で見る</a>
  <div class="card">
    <p>なにもない丘に、テントとニワトリ3羽。畑の麦はニワトリのエサに、卵は加工小屋でマヨネーズに。となりどうしのエリアがつながって、牧場がひとつの大きな流れになっていきます。</p>
    <ul>
      <li>ドラッグで歩くだけ。近くを通れば拾い、出荷台のそばで積みます</li>
      <li>森を切りひらいて、菜園・牛舎・果樹園・羊小屋・養蜂場・パン工房へ</li>
      <li>仔馬を育てて草競馬、商店街からの注文、品評会</li>
    </ul>
  </div>
  <div class="card">
    <ul>
      <li><a href="https://principled-swordtail-490.notion.site/408c86e5c83e8198bfd7f31ce904b5ae">プライバシーポリシー</a></li>
      <li><a href="https://principled-swordtail-490.notion.site/408c86e5c83e81b69dbbf43644826a50">利用規約</a></li>
    </ul>
  </div>
  <footer>© 2026 Hirotaka Kouso</footer>
</main>
</body>
</html>
